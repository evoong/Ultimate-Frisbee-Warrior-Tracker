    <!--
      Structured data for search engines and AI answer engines (ChatGPT,

    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Ultimate Frisbee Warrior Tracker",
        "applicationCategory": "SportsApplication",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Ultimate Frisbee Warrior Tracker free to use?",
            "acceptedAnswer": {

              "text": "Yes. Signup is open, and any signed-in user can create a new team or join an existing one for free."

            "@type": "Question",
            "name": "Can I track live scores during a game?",

            "acceptedAnswer": {

              "text": "Yes. An organization can run one team or several, and League Standings automatically tracks every team's record, points, and point differential for a season as games are scored."
            }
          },
          {
            "@type": "Question",
            "name": "Can I diagram and animate strategy plays?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The Strategy board lets you build named plays step by step with player positions, opponent markers, and arrows, then step through them like a play-by-play animation."
            }
          },
          {
            "@type": "Question",
            "name": "Is there an AI assistant?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The built-in AI chat can answer questions about your team's stats and, once you confirm, log events or manage lineups for you. The same tools are also available to external AI clients over MCP."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to install anything?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Ultimate Frisbee Warrior Tracker runs in the browser on desktop and mobile, with no app download required."

          }
