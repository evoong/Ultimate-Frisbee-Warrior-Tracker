<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e4e7;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#18181b;">
          <tr><td style="padding:28px 28px 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#71717a;">Warrior Tracker</td></tr>
          <tr><td style="padding:0 28px;font-size:20px;font-weight:600;line-height:1.3;">Confirm your email</td></tr>
          <tr><td style="padding:12px 28px 0;font-size:14px;line-height:1.6;color:#3f3f46;">Confirm this email address to finish setting up your Warrior Tracker account. If a team invited you, you'll be added to it as soon as you're in.</td></tr>
          <tr><td style="padding:24px 28px;">
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:11px 20px;border-radius:6px;">Confirm email</a>
          </td></tr>
          <tr><td style="padding:0 28px 28px;font-size:12px;line-height:1.6;color:#71717a;">The link works once and expires shortly. If you didn't create an account, you can ignore this email.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
